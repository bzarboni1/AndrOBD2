# Pre-commit hooks configuration for prek
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
---

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: fix-byte-order-marker

  # YAML formatting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]
        types: [yaml]
        stages: [commit]

  # Gradle checks
  - repo: local
    hooks:
      - id: gradle-check
        name: Gradle check
        entry: ./gradlew check
        language: system
        files: \.(java|gradle)$
        pass_filenames: false
        stages: [push]

  # Android lint (optional, runs only if files changed)
  - repo: local
    hooks:
      - id: android-lint
        name: Android lint
        entry: bash -c 'cd androbd && ../gradlew lint --no-build-cache'
        language: system
        files: androbd/src/.*\.java$
        pass_filenames: false
        stages: [push]

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from prek hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [gradle-check, android-lint]
  submodules: false
