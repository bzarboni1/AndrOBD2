plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fr3ts0n.androbdmodern'
    compileSdk 35

    defaultConfig {
        applicationId "com.fr3ts0n.androbdmodern"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
}
